# Forma: Holotype — заметки и документация проекта FORMA.
# Общая основа программ Forma (крейты forma-*) живёт в репозитории Forma Mycelium
# и подключается по путям: разные программы — одна основа.
[workspace]
resolver = "3"
members = ["crates/holotype", "crates/holotype-vault"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
holotype-vault = { path = "crates/holotype-vault" }
forma-build = { path = "../ModdingIDE/crates/forma-build" }
forma-i18n = { path = "../ModdingIDE/crates/forma-i18n" }
forma-layout = { path = "../ModdingIDE/crates/forma-layout" }
forma-ui = { path = "../ModdingIDE/crates/forma-ui" }
forma-actions = { path = "../ModdingIDE/crates/forma-actions" }
forma-settings = { path = "../ModdingIDE/crates/forma-settings" }
forma-plugins = { path = "../ModdingIDE/crates/forma-plugins" }
forma-shell = { path = "../ModdingIDE/crates/forma-shell" }

eframe = { version = "0.36", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
    "accesskit",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
